[pytest]
# ---------------------------------------------------------------------------
# Pytest configuration for Spotify Toolkit
# ---------------------------------------------------------------------------

# Where to look for tests
testpaths = tests

# Default options: verbose output, short tracebacks, coloured results
addopts =
    -q
    --tb=short
    --color=yes

# Treat warnings as errors so they don't slip through unnoticed
filterwarnings =
    error
    # Spotipy / urllib3 internals emit deprecation notices on some Python
    # versions — suppress them so they don't clutter CI output.
    ignore::DeprecationWarning:spotipy
    ignore::DeprecationWarning:urllib3

# Minimum pytest version required
minversion = 7.0
